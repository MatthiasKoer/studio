<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Studio</title>
<style>
:root{
  --blue:#185FA5; --green:#3B6D11; --amber:#BA7517; --red:#A32D2D;
  --page:#f2f2f7; --card:#ffffff; --fill:#e9e9ef;
  --tx:#111113; --tx2:#6b6b72; --tx3:#9a9aa2; --line:#e0e0e6;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{
    --blue:#5DA9F0; --green:#7CC44B; --amber:#EFA53B; --red:#F0797A;
    --page:#000000; --card:#1c1c1e; --fill:#2c2c2e;
    --tx:#ffffff; --tx2:#98989f; --tx3:#6b6b72; --line:#2f2f33;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:var(--page); color:var(--tx);
  padding-top:var(--safe-top);
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1{font-size:30px;font-weight:600;letter-spacing:-.4px;margin:6px 0 14px}
h2{font-size:20px;font-weight:600;margin:0}
.wrap{padding:12px 16px 130px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px}
.card+.card{margin-top:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--tx2)}
.muted{color:var(--tx2)}
.small{font-size:13px}
.tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

.btn{background:var(--blue);color:#fff;border-radius:11px;padding:12px;font-weight:600;font-size:16px;width:100%;text-align:center;display:block}
.btn.ghost{background:var(--fill);color:var(--tx)}
.btn.danger{background:var(--fill);color:var(--red)}
.chip{background:var(--fill);border-radius:9px;padding:6px 11px;font-size:14px;font-weight:500;display:inline-block}
.chip.on{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
.chips.scroll .chip{flex:none}
.tag{font-size:11px;color:var(--tx2);background:var(--fill);border-radius:6px;padding:2px 6px;margin-right:4px;display:inline-block;margin-top:3px}
.pill{background:var(--blue);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}

.field{background:var(--fill);border:1.5px solid transparent;border-radius:10px;padding:9px 8px;text-align:right;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;width:100%;-webkit-appearance:none;appearance:none}
.field:focus{outline:none;border-color:var(--blue);background:var(--card)}
.fieldwrap{position:relative}
.fieldwrap .field{padding-right:32px}
.fieldwrap.wide .field{padding-right:42px}
.fieldwrap .unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.txt{background:var(--fill);border:1.5px solid transparent;border-radius:10px;padding:11px;width:100%;font-size:16px;-webkit-appearance:none;appearance:none}
.txt:focus{outline:none;border-color:var(--blue);background:var(--card)}

.setrow{display:grid;grid-template-columns:18px 1fr 1fr 44px;align-items:center;gap:8px;padding:5px 0}
.setrow.done{opacity:.55}
.setrow.sides{grid-template-columns:18px 1fr 44px}
.sidegrid{display:grid;grid-template-columns:16px 1fr 1fr;gap:6px 8px;align-items:center}
.sidegrid .lr{font-size:12px;font-weight:600;color:var(--tx2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--fill);border-radius:10px;padding:11px 12px;margin-top:6px}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--tx3);display:flex;align-items:center;justify-content:center;margin-left:auto}
.tick.on{background:var(--green);border-color:var(--green)}
.tick svg{width:17px;height:17px;stroke:#fff;stroke-width:3.4;fill:none;display:none}
.tick.on svg{display:block}
.unit{font-size:11px;color:var(--tx2);font-weight:400}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-bot);z-index:40}
.tabbar button{flex:1;padding:8px 2px 6px;color:var(--tx3);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

#restbar{position:fixed;left:0;right:0;bottom:calc(50px + var(--safe-bot));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 16px;z-index:39;display:none;transform:translateZ(0);will-change:transform;contain:layout paint}
#restbar.show{display:block}
#restclock{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--blue)}
#restbar.over #restclock{color:var(--green)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--blue);border-radius:2px;transform-origin:left center;transform:scaleX(0);transition:transform .25s linear;will-change:transform}
#restbar.over .bar i{background:var(--green)}
#restbar.work #restclock{color:var(--amber)}
#restbar.work .bar i{background:var(--amber)}
.play{background:var(--fill);border-radius:10px;padding:9px 8px;font-size:16px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;width:100%;text-align:center}
.play.run{color:var(--amber)}
.mv{width:30px;height:30px;border-radius:8px;background:var(--fill);color:var(--tx2);font-size:14px;flex:none}
.mv:disabled{opacity:.3}
.seg4 button{font-size:14px;padding:8px 2px}

.sheet{position:fixed;inset:0;background:var(--page);z-index:60;display:none;flex-direction:column;padding-top:var(--safe-top)}
.sheet.show{display:flex}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px}
.sheethead b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheethead button{color:var(--blue);font-size:16px;font-weight:500;flex:none}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(40px + var(--safe-bot))}

.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0;min-height:68px}
.thumbs img{height:64px;width:64px;object-fit:cover;border-radius:9px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.grid img{width:100%;height:96px;object-fit:cover;border-radius:10px}
.imgbox{position:relative}
.imgbox img,.thumbs img{cursor:zoom-in}
#lightbox{position:fixed;inset:0;z-index:100;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#lightbox.show{display:block}
#lightbox img{position:absolute;left:50%;top:50%;width:100vw;height:100vh;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none}
#lbclose{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:38px;text-align:center;z-index:2}
#lbcount{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:13px;z-index:2}
#lbhint{position:absolute;top:calc(18px + env(safe-area-inset-top));left:16px;color:rgba(255,255,255,.6);font-size:12px;z-index:2}
.imgbox .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:24px;text-align:center}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{background:var(--card);border-radius:12px;padding:11px}
.stat b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:12px}
.bars i{flex:1;background:var(--blue);border-radius:3px;min-height:2px;display:block}
.empty{text-align:center;padding:56px 24px;color:var(--tx2)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.listitem{padding:12px 0;border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:0}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:15px;font-weight:500;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.unitchip{background:var(--fill);border-radius:7px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--tx2);flex:none}
select.txt{background-image:none}
label.lbl{display:block;font-size:13px;color:var(--tx2);margin:14px 0 5px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="app"></div>

<div id="restbar">
  <div class="row">
    <span id="restclock">0:00</span>
    <div class="grow">
      <div style="font-size:14px;font-weight:600" id="resttitle">Pause</div>
      <div class="tiny muted trunc" id="restlabel"></div>
    </div>
    <button class="chip" id="restplus">+30</button>
    <button class="chip" id="reststop" style="background:var(--blue);color:#fff">Stopp</button>
  </div>
  <div class="bar"><i id="restfill"></i></div>
</div>

<nav class="tabbar" id="tabbar"></nav>

<div id="lightbox"><button id="lbclose" aria-label="Schließen">×</button><div id="lbhint">Doppeltippen oder mit zwei Fingern zoomen</div><img id="lbimg" alt=""><div id="lbcount"></div></div>
<div class="sheet" id="sheet">
  <div class="sheethead">
    <button id="sheetclose">Fertig</button>
    <b id="sheettitle"></b>
    <span style="width:44px"></span>
  </div>
  <div class="sheetbody" id="sheetbody"></div>
</div>

<input type="file" id="filepick" accept="image/*" multiple class="hidden">
<input type="file" id="jsonpick" accept="application/json,.json" class="hidden">

<script>
"use strict";

/* ---------- Speicher ---------- */

const KEY = "studio.data.v1";
let D = null;

const DEFAULTS = () => ({
  plans: [
    { id: uid(), name: "Einheit A", subtitle: "Hintere Kette + Rumpf",
      mobility: ["Aufwärmen: 8–10 Min Stepper, Laufband oder Rad",
                 "Thoraxrotation sitzend – 10× pro Seite",
                 "Hüftbeuger-Dehnung rechts – 60 Sek",
                 "SCM-Dehnung links – 60 Sek"],
      exercises: [
        { id: uid(), name: "Rumänisches Kreuzheben Langhantel", sets: 3, reps: 10, rest: 90 },
        { id: uid(), name: "Einbeiniges Kreuzheben rechts", sets: 2, reps: 10, rest: 90 },
        { id: uid(), name: "Kabelzug Rudern beidarmig", sets: 3, reps: 12, rest: 60 },
        { id: uid(), name: "Lat Pulldown", sets: 3, reps: 10, rest: 60 },
        { id: uid(), name: "Bauchmaschine", sets: 3, reps: 15, rest: 45 },
        { id: uid(), name: "Rückenstreckmaschine", sets: 3, reps: 12, rest: 45 },
        { id: uid(), name: "Pilates-Stuhl hintere Kette", sets: 2, reps: 8, rest: 60 }
      ]},
    { id: uid(), name: "Einheit B", subtitle: "Oberkörper + Schulter",
      mobility: ["Aufwärmen: 8–10 Min Stepper, Laufband oder Rad",
                 "Schulterkreisen groß – 10×",
                 "Brustöffnung an der Wand – 60 Sek",
                 "SCM-Dehnung links – 60 Sek"],
      exercises: [
        { id: uid(), name: "Kabelzug Rudern einarmig links", sets: 3, reps: 12, rest: 60 },
        { id: uid(), name: "Kabelzug Rudern einarmig rechts", sets: 3, reps: 10, rest: 60 },
        { id: uid(), name: "Schulterdrücken Kurzhantel einarmig rechts", sets: 2, reps: 10, rest: 90 },
        { id: uid(), name: "Seitheben Kabelzug beidseits", sets: 3, reps: 12, rest: 45 },
        { id: uid(), name: "Bizeps Kurzhantel", sets: 2, reps: 12, rest: 45 },
        { id: uid(), name: "Trizeps Kabelzug", sets: 2, reps: 12, rest: 45 },
        { id: uid(), name: "Bauchmaschine", sets: 3, reps: 15, rest: 45 }
      ]}
  ],
  history: [],
  active: null,
  library: {},
  units: {},
  hidden: []
});

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    D = raw ? JSON.parse(raw) : DEFAULTS();
  }catch(e){ D = DEFAULTS(); }
  if(!D.plans) D.plans = [];
  if(!D.history) D.history = [];
  if(!D.library) D.library = {};
  if(!D.units) D.units = {};
  if(!D.hidden) D.hidden = [];
  if(!D.cats) D.cats = {};
  if(!D.repoCats) D.repoCats = {};
  if(!D.catalog) D.catalog = {};
  /* Ältere Einträge wurden immer in kg erfasst — festschreiben, damit ein späteres Umstellen sie nicht umdeutet */
  for(const w of D.history) for(const e of w.exercises||[]) if(!e.unit) e.unit = "kg";
  if(D.active) for(const e of D.active.exercises||[]) if(!e.unit) e.unit = "kg";
  migrate();
  cleanNames();
}
/* Einmalig: Studio-Kürzel aus Übungsnamen entfernen (Verlauf wird zusammengeführt,
   die Einheit steckt jetzt im Plan) und Tippfehler korrigieren. */
function cleanNames(){
  if(D.namesCleaned) return;
  const map = {};
  for(const p of D.plans){
    const m = / – (\S+)$/.exec(p.name || "");
    if(!m) continue;
    const suf = " " + m[1];
    for(const e of p.exercises||[]) if(e.name.endsWith(suf)) map[e.name] = e.name.slice(0, -suf.length).trim();
  }
  Object.assign(map, { "Goblet Sqat": "Goblet Squat", "Lat Pulldow": "Lat Pulldown" });
  for(const [from, to] of Object.entries(map)) renameExercise(from, to);
  D.namesCleaned = true; save();
}
/* Einheit hängt an der Übung im Plan (pro Studio), nicht mehr global am Namen.
   Bestehende Pläne übernehmen einmalig die bisherige globale Einstellung. */
function migrate(){
  if(!D.units) D.units = {};
  for(const p of D.plans||[]) for(const e of p.exercises||[]) if(!e.unit) e.unit = unitOf(e.name);
}
/* ---------- Pläne aus dem Repo (plans.json) ----------
   Die App fragt beim Start nach plans.json. Gibt es eine neue Version, erscheint ein Hinweis;
   übernommen wird erst nach Bestätigung. Verlauf, Gewichte und die kg/Stufen-Einstellung
   pro Studio-Plan bleiben erhalten. Pläne, die es im Repo nicht gibt, bleiben unberührt. */
const REMOTE_URLS = ["plans.json", "https://raw.githubusercontent.com/MatthiasKoer/studio/main/plans.json"];
let remote = null;
async function fetchRemote(){
  for(const u of REMOTE_URLS){
    try{
      const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.version && Array.isArray(j.plans)) return j;
    }catch(e){}
  }
  return null;
}
async function checkRemote(){
  const j = await fetchRemote();
  if(!j) return;
  syncMeta(j);
  if(j.version === D.repoVersion || j.version === D.repoSkipped){ if(tab === "lib") render(); return; }
  remote = j; render();
}
const normName = s => String(s||"").toLowerCase()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");
/* Lokale Pläne zu einem Repo-Plan: gleicher Name oder Studio-Variante „Einheit A – Studio“ */
const localPlansFor = rp => D.plans.filter(p => p.name === rp.name || (p.name||"").startsWith(rp.name + " – "));
/* Übungen eines Repo-Plans für einen lokalen Plan. Eine Übung kann pro Studio ersetzt
   oder weggelassen werden: "studios": { "S53": { "name": "…" } } bzw. { "S53": null }.
   Das Studio ist der Namenszusatz des lokalen Plans („Einheit A – S53“). */
const studioOf = lp => { const m = / – (.+)$/.exec((lp && lp.name) || ""); return m ? normName(m[1]) : ""; };
function planExercises(rp, lp){
  const st = studioOf(lp), out = [];
  for(const re of rp.exercises){
    const key = st && re.studios ? Object.keys(re.studios).find(k => normName(k) === st) : undefined;
    if(key === undefined){ out.push(re); continue; }
    const alt = re.studios[key];
    if(alt) out.push(Object.assign({}, re, { aliases: [] }, alt));
  }
  return out;
}
/* Alle Repo-Übungen inkl. Studio-Ersatz (für das Umbenennen) */
const allRemoteEx = j => j.plans.flatMap(rp => [...rp.exercises,
  ...rp.exercises.flatMap(re => Object.values(re.studios || {}).filter(Boolean).map(alt => Object.assign({}, re, { aliases: [] }, alt)))]);
/* Lokaler Name, unter dem eine Repo-Übung schon existiert (für Umbenennen samt Verlauf) */
function localNameFor(re){
  const keys = new Set([re.name, ...(re.aliases||[])].map(normName));
  const names = new Set();
  D.plans.forEach(p => (p.exercises||[]).forEach(e => names.add(e.name)));
  D.history.forEach(w => (w.exercises||[]).forEach(e => names.add(e.name)));
  Object.keys(D.library).forEach(n => names.add(n));
  if(names.has(re.name)) return re.name;
  for(const n of names) if(keys.has(normName(n))) return n;
  return null;
}
/* Beschreibungen aus plans.json: für Planübungen und für Übungen, die es lokal schon gibt
   (auch unter anderem Namen, über aliases). Unbekannte Übungen werden nicht angelegt.
   Ersetzt wird nur ein leerer Text oder der zuletzt übernommene Repo-Text — eigene Notizen bleiben. */
function infoTargets(j){
  if(!D.repoInfo) D.repoInfo = {};
  const planNames = new Set(allRemoteEx(j).map(e => e.name));
  const hid = new Set(D.hidden || []);
  const out = [], done = new Set();
  for(const [key, val] of Object.entries(j.info || {})){
    const text = typeof val === "string" ? val : val.text;
    const name = planNames.has(key) ? key : localNameFor({ name: key, aliases: (val && val.aliases) || [] });
    if(!name || hid.has(name) || done.has(name)) continue;
    const cur = detail(name).text;
    if(cur === text) continue;
    if(cur.trim() && cur !== D.repoInfo[name]) continue;
    done.add(name); out.push({ name, text });
  }
  return out;
}
/* Kategorien und Vorschläge – unabhängig vom Übernehmen eines Planstands, bei jedem Start.
   Ändert nur Zuordnungen, nie Pläne oder Verlauf. Reihenfolge: eigene Zuordnung (D.cats) →
   Repo-Zuordnung über Name/aliases → Stichwort-Regeln (catRules) für unbekannte Namen. */
function syncMeta(j){
  if(Array.isArray(j.categories) && j.categories.length) D.catDefs = j.categories;
  const planNames = new Set(allRemoteEx(j).map(e => e.name));
  const explicit = {};
  const catalog = {};
  for(const [key, val] of Object.entries(j.info || {})){
    const v = typeof val === "string" ? { text: val } : val;
    const name = localNameFor({ name: key, aliases: v.aliases || [] }) || (planNames.has(key) && knownExercises().some(k => k.name === key) ? key : null);
    if(name){ if(v.cat && !explicit[name]) explicit[name] = v.cat; }
    else if(!v.mobOnly && !(D.hidden||[]).includes(key)) catalog[key] = { text: v.text || "", cat: v.cat || [], unit: v.unit || "" };
  }
  const rules = Array.isArray(j.catRules) ? j.catRules : [];
  const byRule = name => {
    const n = name.toLowerCase();
    const r = rules.find(r => (r.match||[]).some(m => n.includes(String(m).toLowerCase())));
    return r ? (r.cat || []) : [];
  };
  const rc = {};
  for(const k of knownExercises()){
    const c = explicit[k.name] || byRule(k.name);
    if(c && c.length) rc[k.name] = c;
  }
  D.repoCats = rc;
  D.catalog = catalog;
  const idx = {};
  for(const [key, val] of Object.entries(j.info || {})){
    const v = typeof val === "string" ? { text: val } : val;
    for(const n of [key, ...(v.aliases || [])]) idx[normName(n)] = key;
  }
  D.infoIndex = idx;
  D.repoMobility = Object.fromEntries(j.plans.filter(rp => rp.mobility && rp.mobility.length).map(rp => [rp.name, rp.mobility]));
  D.mobTexts = Object.fromEntries(Object.entries(j.info || {}).filter(([,v]) => v && v.mobOnly).map(([k,v]) => [k, v.text]));
  save();
}
/* Zwei einseitige Übungen (links/rechts) zu einer L/R-Übung zusammenführen.
   In plans.json: "mergeSides": { "left": "… links", "right": "… rechts" }.
   Verlauf: Satz i links + Satz i rechts → ein L/R-Satz. Eigene Notizen bleiben erhalten. */
function sideMerges(j){
  const out = [];
  for(const re of allRemoteEx(j)) if(re.mergeSides){
    const L = localNameFor({ name: re.mergeSides.left, aliases: [] }), R = localNameFor({ name: re.mergeSides.right, aliases: [] });
    if((L || R) && L !== re.name && R !== re.name && !out.some(m => m.to === re.name)) out.push({ to: re.name, L, R });
  }
  return out;
}
function mergeSidesLocal(m){
  const { to, L, R } = m;
  /* Verlauf */
  for(const w of D.history){
    const ex = w.exercises || [];
    const il = L ? ex.findIndex(e => e.name === L) : -1, ir = R ? ex.findIndex(e => e.name === R) : -1;
    if(il < 0 && ir < 0) continue;
    const el = il >= 0 ? ex[il] : null, er = ir >= 0 ? ex[ir] : null;
    const sl = el ? doneSets(el) : [], sr = er ? doneSets(er) : [];
    const n = Math.max(sl.length, sr.length);
    const merged = { name: to, unit: (er || el).unit || "kg", sides: true, rest: (er || el).rest, reps: (er || el).reps,
      sets: Array.from({ length: n }, (_, i) => ({ w: sr[i] ? sr[i].w || 0 : null, r: sr[i] ? sr[i].r || 0 : null,
        wl: sl[i] ? sl[i].w || 0 : null, rl: sl[i] ? sl[i].r || 0 : null, done: true })) };
    const first = Math.min(...[il, ir].filter(i => i >= 0));
    w.exercises = ex.filter((_, i) => i !== il && i !== ir);
    w.exercises.splice(first, 0, merged);
  }
  /* Pläne: Eintrag der linken (sonst rechten) Seite wird zur neuen Übung, die andere entfällt */
  for(const p of D.plans){
    const ex = p.exercises || [];
    const keep = ex.find(e => e.name === L) || ex.find(e => e.name === R);
    if(!keep) continue;
    p.exercises = ex.filter(e => e === keep || (e.name !== L && e.name !== R));
    keep.name = to; keep.sides = true;
  }
  /* Beschreibung, Bilder, Einheit, Kategorien */
  if(!D.repoInfo) D.repoInfo = {};
  const parts = [], imgs = [];
  for(const [lab, n] of [["Links", L], ["Rechts", R]]){
    if(!n) continue;
    const d = D.library[n];
    if(d){ if(d.text && d.text.trim() && d.text !== D.repoInfo[n]) parts.push(lab + ": " + d.text.trim()); imgs.push(...(d.images || [])); }
    delete D.library[n]; delete D.repoInfo[n];
    if(D.units[n] && !D.units[to]) D.units[to] = D.units[n];
    delete D.units[n];
    if(D.cats && D.cats[n] && !D.cats[to]) D.cats[to] = D.cats[n];
    if(D.cats) delete D.cats[n];
    unhide(to); D.hidden = (D.hidden || []).filter(x => x !== n);
  }
  if(parts.length || imgs.length) D.library[to] = { text: parts.join("\n\n"), images: imgs };
}
/* Was würde sich ändern? Für die Vorschau. */
function remoteDiff(j){
  const out = { renames: [], plans: [], merges: sideMerges(j) };
  const seen = new Set();
  for(const re of allRemoteEx(j)){
    const ln = localNameFor(re);
    if(ln && ln !== re.name && !seen.has(ln)){ seen.add(ln); out.renames.push([ln, re.name]); }
  }
  const ren = new Map(out.renames);
  for(const m of out.merges){ if(m.L) ren.set(m.L, m.to); if(m.R) ren.set(m.R, m.to); }
  for(const rp of j.plans){
    const locals = localPlansFor(rp);
    if(!locals.length){ out.plans.push({ name: rp.name, isNew: true, add: planExercises(rp, null).map(e => e.name), del: [], changed: [] }); continue; }
    for(const lp of locals){
      const rex = planExercises(rp, lp), target = rex.map(e => e.name);
      const cur = [...new Set((lp.exercises||[]).map(e => ren.get(e.name) || e.name))];
      const changed = rex.filter(re => { const le = (lp.exercises||[]).find(e => (ren.get(e.name)||e.name) === re.name);
        return le && (le.sets !== re.sets || le.reps !== re.reps || !!le.sides !== !!re.sides || (re.repsL||0) !== (le.repsL||0)); })
        .map(re => re.name + " → " + re.sets + " × " + (re.sides && re.repsL ? re.repsL + "/" + re.reps : re.reps) + (re.sides ? ", links/rechts getrennt" : ""));
      out.plans.push({ name: lp.name, isNew: false,
        add: target.filter(n => !cur.includes(n)), del: cur.filter(n => !target.includes(n)), changed });
    }
  }
  return out;
}
function applyRemote(j){
  for(const m of sideMerges(j)) mergeSidesLocal(m);
  for(const re of allRemoteEx(j)){
    const ln = localNameFor(re);
    if(ln && ln !== re.name) renameExercise(ln, re.name);
  }
  for(const rp of j.plans){
    let locals = localPlansFor(rp);
    if(!locals.length){ const np = { id: uid(), name: rp.name, subtitle: "", mobility: [], exercises: [] }; D.plans.push(np); locals = [np]; }
    for(const lp of locals){
      const old = lp.exercises || [];
      const w = old.filter(e => isWeight(e.unit));
      const planUnit = w.filter(e => e.unit === "stufe").length > w.length/2 ? "stufe" : "kg";
      lp.subtitle = rp.subtitle || lp.subtitle;
      if(rp.mobility) lp.mobility = rp.mobility.slice();
      lp.exercises = planExercises(rp, lp).map(re => {
        const le = old.find(e => e.name === re.name);
        const unit = re.unit || (le && isWeight(le.unit) ? le.unit : (D.units[re.name] && !isWeight(D.units[re.name]) ? D.units[re.name] : planUnit));
        unhide(re.name);
        const pe = { id: le ? le.id : uid(), name: re.name, sets: re.sets, reps: re.reps, rest: re.rest, unit };
        if(re.sides) pe.sides = true;
        if(re.sides && re.repsL) pe.repsL = re.repsL;
        return pe;
      });
    }
  }
  for(const t of infoTargets(j)){
    D.library[t.name] = { text: t.text, images: detail(t.name).images || [] };
    D.repoInfo[t.name] = t.text;
  }
  syncMeta(j);
  D.repoVersion = j.version;
  delete D.repoSkipped;
  remote = null;
  save();
}

/* ---------- Bilder in IndexedDB ---------- */

let idb = null;
function openDB(){
  return new Promise(res => {
    if(idb) return res(idb);
    const rq = indexedDB.open("studio-images", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("img");
    rq.onsuccess = () => { idb = rq.result; res(idb); };
    rq.onerror = () => res(null);
  });
}
async function imgPut(id, dataURL){
  const db = await openDB(); if(!db) return;
  return new Promise(res => {
    const tx = db.transaction("img","readwrite");
    tx.objectStore("img").put(dataURL, id);
    tx.oncomplete = res; tx.onerror = res;
  });
}
async function imgGet(id){
  const db = await openDB(); if(!db) return null;
  return new Promise(res => {
    const rq = db.transaction("img","readonly").objectStore("img").get(id);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => res(null);
  });
}
async function imgDel(id){
  if(typeof thumbCache !== "undefined") thumbCache.delete(id);
  const db = await openDB(); if(!db) return;
  const tx = db.transaction("img","readwrite");
  tx.objectStore("img").delete(id);
}
async function imgAll(){
  const db = await openDB(); if(!db) return {};
  return new Promise(res => {
    const out = {};
    const st = db.transaction("img","readonly").objectStore("img");
    const rq = st.openCursor();
    rq.onsuccess = () => {
      const c = rq.result;
      if(!c) return res(out);
      out[c.key] = c.value; c.continue();
    };
    rq.onerror = () => res(out);
  });
}

function shrink(file, max){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        let {width:w, height:h} = im;
        const longest = Math.max(w,h);
        if(longest > max){ const f = max/longest; w = Math.round(w*f); h = Math.round(h*f); }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(im, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", 0.78));
      };
      im.onerror = () => res(null);
      im.src = fr.result;
    };
    fr.onerror = () => res(null);
    fr.readAsDataURL(file);
  });
}

/* ---------- Formate ---------- */

const de = n => String(n).replace(".", ",");
function kg(v){
  const r = Math.round(v*100)/100;
  return (r === Math.round(r) ? r : de(r.toFixed(1))) + " kg";
}
/* Einheit je Übung: "kg" (Standard), "stufe" (Gewichtsstufe an der Maschine),
   "sek" (Haltezeit, z. B. Plank) oder "seite" (Wiederholungen pro Seite, ohne Gewicht) */
const UNITS = ["kg","stufe","sek","seite"];
const unitOf = name => (D.units && D.units[name]) || "kg";
const exUnit = ex => ex.unit || unitOf(ex.name);
const peUnit = exUnit; /* Übung im Plan: eigene Einheit, sonst globale Voreinstellung */
const isWeight = u => u === "kg" || u === "stufe";
function setUnit(name, u){
  if(u && u !== "kg" && UNITS.includes(u)) D.units[name] = u; else delete D.units[name];
}
function stufe(v){ const r = Math.round(v*10)/10; return "Stufe " + (r === Math.round(r) ? r : de(r.toFixed(1))); }
const fmtW = (v, u) => u === "stufe" ? stufe(v) : kg(v);
const hasSides = s => s && (s.wl !== undefined || s.rl !== undefined);
const fmtSet = (s, u) => u === "sek" ? (s.r||0) + " Sek" : u === "seite" ? (s.r||0) + " / Seite"
  : hasSides(s) ? "L " + (s.wl == null ? "–" : fmtW(s.wl, u) + " × " + (s.rl||0)) + " · R " + (s.w == null ? "–" : fmtW(s.w, u) + " × " + (s.r||0))
  : fmtW(s.w, u) + " × " + s.r;
/* Seiten eines Satzes als Liste [{w,r}] – bei getrennten Seiten links und rechts */
const setSides = s => (hasSides(s) ? [{ w: s.wl, r: s.rl }, { w: s.w, r: s.r }] : [{ w: s.w, r: s.r }])
  .filter(x => x.w != null).map(x => ({ w: x.w || 0, r: x.r || 0 }));
const unitShort = u => ({stufe:"St.", sek:"Sek", seite:"/Seite"})[u] || "kg";
const unitLong = u => ({stufe:"Stufe", sek:"Sek", seite:"Wdh./Seite"})[u] || "kg";
const repsLabel = u => u === "sek" ? "Sekunden pro Satz" : u === "seite" ? "Wiederholungen pro Seite" : "Wiederholungen";
const planLine = e => { const u = peUnit(e);
  const lr = e.sides && isWeight(u);
  return e.sets + " × " + (lr && e.repsL && e.repsL !== e.reps ? e.repsL + "/" + e.reps : e.reps)
    + (u === "sek" ? " Sek" : u === "seite" ? " /Seite" : "") + (lr ? " · L/R" : ""); };
function vol(v){
  if(v >= 1000) return de((v/1000).toFixed(1)) + " t";
  return Math.round(v) + " kg";
}
function dur(ms){
  const m = Math.max(0, Math.floor(ms/60000));
  return m < 60 ? m + " Min" : Math.floor(m/60) + " Std " + (m%60) + " Min";
}
function clock(s){
  s = Math.max(0, s);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
const DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sept","Okt","Nov","Dez"];
const MONL = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function dayLong(ts){ const d = new Date(ts); return DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONL[d.getMonth()]; }
function dayShort(ts){ const d = new Date(ts); return d.getDate() + ". " + MON[d.getMonth()]; }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Auswertung ---------- */

const doneSets = ex => (ex.sets || []).filter(s => s.done);
const exVolume = ex => exUnit(ex) !== "kg" ? 0 : doneSets(ex).reduce((a,s) => a + setSides(s).reduce((b,x) => b + x.w * x.r, 0), 0);
const wkVolume = w => (w.exercises||[]).reduce((a,e) => a + exVolume(e), 0);
const wkDone = w => (w.exercises||[]).reduce((a,e) => a + doneSets(e).length, 0);
const wkPlanned = w => (w.exercises||[]).reduce((a,e) => a + (e.sets||[]).length, 0);
function e1rm(ex){
  if(exUnit(ex) !== "kg") return 0;
  const v = doneSets(ex).flatMap(setSides).filter(s => s.w > 0 && s.r > 0).map(s => s.w * (1 + s.r/30));
  return v.length ? Math.max.apply(null, v) : 0;
}
function topLevel(ex){
  const v = doneSets(ex).flatMap(setSides).filter(s => s.w > 0).map(s => s.w);
  return v.length ? Math.max.apply(null, v) : 0;
}
/* Kennzahl für die Entwicklungskurve: kg-Übungen → 1RM-Schätzung, Stufen-Übungen → höchste Stufe */
function topReps(ex){ const v = doneSets(ex).map(s => s.r||0); return v.length ? Math.max.apply(null, v) : 0; }
const progress = ex => { const u = exUnit(ex);
  return u === "stufe" ? topLevel(ex) : u === "kg" ? e1rm(ex) : topReps(ex); };

/* Sätze vorbelegen mit den Werten vom letzten Training in derselben Einheit
   (Stufen-Studio → letzte Stufen, kg-Studio → letzte kg) */
function prefillSets(name, n, reps, unit, sides, repsL){
  const prev = lastLog(name, unit || unitOf(name));
  const ps = prev ? doneSets(prev.ex) : [];
  return Array.from({length: n}, (_,i) => {
    const p = ps[i] || ps[ps.length-1] || {};
    /* letzter echter Wert einer Seite (fehlende Sätze sind null) */
    const pick = k => { if(p[k] != null) return p[k]; for(let x = ps.length-1; x >= 0; x--) if(ps[x][k] != null) return ps[x][k]; return null; };
    const wr = pick("w");
    const set = { w: wr || 0, r: reps, done: false };
    /* Links: letzter Linkswert, sonst (früher ohne Seiten erfasst) derselbe Wert wie rechts */
    if(sides){ const wl = pick("wl"); set.wl = wl != null ? wl : (wr || 0); set.rl = repsL || reps; }
    return set;
  });
}

/* Alle bekannten Übungen: aus Plänen, Verlauf, Beschreibungen und Einheiten */
function knownExercises(){
  const m = new Map();
  const hid = new Set(D.hidden || []);
  const add = (n, t) => { if(!n || hid.has(n)) return; const o = m.get(n) || { name: n, last: 0, plan: null, plans: 0, logs: 0 };
    if(t && t > o.last) o.last = t; m.set(n, o); return o; };
  for(const p of D.plans) for(const e of p.exercises||[]){ const o = add(e.name); if(o){ o.plans++; if(!o.plan) o.plan = e; } }
  for(const w of D.history) for(const e of w.exercises||[]){ const o = add(e.name, w.start); if(o) o.logs++; }
  Object.keys(D.library).forEach(n => add(n));
  Object.keys(D.units).forEach(n => add(n));
  Object.keys(D.cats || {}).forEach(n => add(n));
  return [...m.values()].sort((a,b) => a.name.localeCompare(b.name, "de"));
}
/* Eine gelöschte Übung taucht wieder auf, sobald man sie erneut verwendet */
function unhide(name){ if(D.hidden && D.hidden.includes(name)) D.hidden = D.hidden.filter(n => n !== name); }

/* Umbenennen bzw. Zusammenführen: alle Vorkommen (Pläne, Verlauf, laufendes Training, Beschreibung, Einheit) */
function renameExercise(from, to){
  if(!to || from === to) return;
  const fix = list => (list||[]).forEach(e => { if(e.name === from) e.name = to; });
  D.plans.forEach(p => {
    fix(p.exercises);
    const seen = new Set();
    p.exercises = p.exercises.filter(e => e.name !== to || !seen.has(to) && seen.add(to));
  });
  D.history.forEach(w => fix(w.exercises));
  if(D.active) fix(D.active.exercises);
  const a = D.library[from], b = D.library[to];
  if(a){
    D.library[to] = b ? { text: b.text.trim() ? b.text : a.text, images: [...b.images, ...a.images] } : a;
    delete D.library[from];
  }
  if(D.units[from]){ if(!D.units[to]) D.units[to] = D.units[from]; delete D.units[from]; }
  for(const c of [D.cats, D.repoCats]) if(c && c[from]){ if(!c[to]) c[to] = c[from]; delete c[from]; }
  if(D.repoInfo && D.repoInfo[from] !== undefined){ if(D.repoInfo[to] === undefined) D.repoInfo[to] = D.repoInfo[from]; delete D.repoInfo[from]; }
  unhide(to);
  D.hidden = (D.hidden||[]).filter(n => n !== from);
  if(statPick === from) statPick = to;
  save();
}

/* Löschen aus dem Archiv: raus aus allen Plänen, Beschreibung, Bilder und Einheit weg. Der Verlauf bleibt. */
function deleteExercise(name){
  D.plans.forEach(p => { p.exercises = (p.exercises||[]).filter(e => e.name !== name); });
  const det = D.library[name];
  if(det) det.images.forEach(id => imgDel(id));
  delete D.library[name];
  delete D.units[name];
  if(D.cats) delete D.cats[name];
  if(D.history.some(w => (w.exercises||[]).some(e => e.name === name))){
    if(!D.hidden.includes(name)) D.hidden.push(name);
  }
  save();
}

function lastLog(name, unit){
  const h = D.history.slice().sort((a,b) => b.start - a.start);
  for(const w of h){
    const m = (w.exercises||[]).find(e => e.name === name && doneSets(e).length && (!unit || exUnit(e) === unit));
    if(m) return { ex: m, start: w.start };
  }
  return null;
}
function detail(name){ return D.library[name] || { text:"", images:[] }; }
function setDetail(name, det){
  if(!det.text.trim() && !det.images.length) delete D.library[name];
  else D.library[name] = det;
  save();
}

/* ---------- Pausen-Timer ---------- */

/* mode "rest" = Pause nach einem Satz, mode "work" = Haltezeit (Sek-Übungen); onDone läuft am Ende einer Haltezeit */
const Rest = {
  end: 0, total: 0, running: false, label: "", tick: null, wake: null, mode: "rest", onDone: null, key: "",
  async start(sec, label, opts){
    if(!sec) return;
    this.stop(true);
    opts = opts || {};
    this.mode = opts.mode || "rest"; this.onDone = opts.onDone || null; this.key = opts.key || "";
    document.getElementById("restbar").classList.toggle("work", this.mode === "work");
    this.total = sec; this.label = label || ""; this.running = true; this._last = {};
    this.end = Date.now() + sec*1000;
    this.tick = setInterval(() => this.render(), 250);
    this.render();
    try{ if("wakeLock" in navigator) this.wake = await navigator.wakeLock.request("screen"); }catch(e){}
    if(navigator.vibrate) navigator.vibrate(12);
  },
  add(s){ if(!this.running) return; this.end += s*1000; this.total += s; this.render(); },
  stop(quiet){
    const wasWork = this.mode === "work" && this.running;
    this.running = false; this.onDone = null; this.key = "";
    clearInterval(this.tick); this.tick = null;
    if(this.wake){ try{ this.wake.release(); }catch(e){} this.wake = null; }
    if(!quiet){ document.getElementById("restbar").classList.remove("show","over","work"); this._last = {}; }
    if(wasWork && !quiet) render();
  },
  _last: {},
  /* Nur schreiben, was sich geändert hat – verhindert unnötiges Neuzeichnen (Zittern auf dem iPhone) */
  _set(id, prop, val){
    if(this._last[id + prop] === val) return;
    this._last[id + prop] = val;
    const el = document.getElementById(id);
    if(prop === "text") el.textContent = val;
    else if(prop === "fill") el.style.transform = "scaleX(" + val + ")";
    else if(prop === "hide") el.classList.toggle("hidden", val);
  },
  _cls(name, on){
    const bar = document.getElementById("restbar");
    if(bar.classList.contains(name) !== on) bar.classList.toggle(name, on);
  },
  render(){
    const left = Math.ceil((this.end - Date.now())/1000);
    this._cls("show", true);
    if(left <= 0){
      if(this.running){
        this.running = false;
        clearInterval(this.tick); this.tick = null;
        if(this.wake){ try{ this.wake.release(); }catch(e){} this.wake = null; }
        beep();
        if(navigator.vibrate) navigator.vibrate([180,90,180]);
        if(this.mode === "work"){
          const fn = this.onDone; this.onDone = null; this.key = "";
          this._cls("show", false); this._cls("work", false);
          if(fn) fn();
          return;
        }
        this._cls("over", true);
        this._set("resttitle", "text", "Pause vorbei");
        this._set("reststop", "text", "OK");
        this._set("restplus", "hide", true);
      }
      this._set("restclock", "text", "0:00");
      this._set("restfill", "fill", "1");
      return;
    }
    this._cls("over", false);
    const work = this.mode === "work";
    this._set("resttitle", "text", work ? "Halten" : "Pause");
    this._set("reststop", "text", "Stopp");
    this._set("restplus", "hide", work);
    this._set("restclock", "text", clock(left));
    this._set("restlabel", "text", this.label);
    /* Füllstand in Viertelsekunden-Schritten; die CSS-Transition glättet dazwischen */
    const ms = Math.max(0, this.end - Date.now());
    this._set("restfill", "fill", Math.min(1, Math.round((1 - ms/(this.total*1000))*400)/400).toString());
  }
};

let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    [0, 0.22, 0.44].forEach(off => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, actx.currentTime + off);
      g.gain.exponentialRampToValueAtTime(0.35, actx.currentTime + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + off + 0.17);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + off); o.stop(actx.currentTime + off + 0.2);
    });
  }catch(e){}
}

/* Welche Einheit ist dran? Studio-Varianten zählen als dieselbe Einheit:
   „Einheit B“ und „Einheit B – S53“ (oder „Einheit B S53“) gehören zusammen. */
function planBase(p){
  const n = (p && p.name) || "";
  const shorter = D.plans.map(x => x.name || "").filter(x => x && x !== n && (n.startsWith(x + " ") || n.startsWith(x + "–")))
    .sort((a,b) => a.length - b.length)[0];
  return normName(shorter || n.split(/ [–-] /)[0]);
}
function suggestedBase(){
  if(!D.plans.length) return null;
  const last = {};
  for(const w of D.history){
    const p = D.plans.find(x => x.id === w.planId);
    if(!p) continue;
    const b = planBase(p);
    if(!(b in last) || w.start > last[b]) last[b] = w.start;
  }
  let best = null, bestAt = Infinity;
  for(const p of D.plans){
    const b = planBase(p), at = last[b] || 0;
    if(at < bestAt){ bestAt = at; best = b; }
  }
  return best;
}
/* für Aufrufer, die einen Plan erwarten: erster Plan der fälligen Einheit */
function suggestedPlan(){ const b = suggestedBase(); return b === null ? null : D.plans.find(p => planBase(p) === b) || null; }
function daysSince(){
  if(!D.history.length) return null;
  const last = Math.max.apply(null, D.history.map(w => w.start));
  return Math.floor((Date.now() - last)/86400000);
}

/* --- Aufwärmen & Mobilität: jede Zeile antippbar, öffnet die Beschreibung --- */
const mobKey = line => String(line).split(/ [–-] |:/)[0].replace(/\(.*?\)/g, "").trim();
function mobResolve(line){
  const k = mobKey(line), nk = normName(k), idx = D.infoIndex || {};
  const known = knownExercises().find(x => normName(x.name) === nk);
  if(known) return { name: known.name, kind: "known" };
  let key = idx[nk];
  if(!key) for(const [n, kk] of Object.entries(idx)) if(n.length > 3 && (nk.startsWith(n) || n.startsWith(nk))){ key = kk; break; }
  if(!key) return { name: k, kind: "none" };
  if(knownExercises().some(x => x.name === key)) return { name: key, kind: "known" };
  if((D.catalog || {})[key]) return { name: key, kind: "sug" };
  if((D.mobTexts || {})[key]) return { name: key, kind: "text" };
  return { name: k, kind: "none" };
}
function mobLine(m, check){
  return `<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line)">
    ${check || ""}
    <span class="grow" data-mob="${esc(m)}" style="cursor:pointer">${esc(m)}</span>
    <span class="muted" data-mob="${esc(m)}" style="cursor:pointer;font-size:15px">ⓘ</span></div>`;
}
function openMobility(line){
  const r = mobResolve(line);
  if(r.kind === "known") return openLibItem(r.name);
  if(r.kind === "sug") return openLibSuggestion(r.name);
  const t = r.kind === "text" ? D.mobTexts[r.name] : "";
  openSheet(r.name, `<p class="small" style="white-space:pre-line;margin:0">${esc(t || "Für diese Übung gibt es noch keine Beschreibung. Sag Claude Bescheid, dann kommt sie mit dem nächsten Planstand.")}</p>`);
}

const workoutMobility = w => (w.mobility && w.mobility.length) ? w.mobility : mobilityFor(w.planId && D.plans.find(p => p.id === w.planId));

    ${open ? `<div class="small" style="margin-top:6px">${list.map((m,i) =>

/* Aufwärmen eines Plans: eigene Liste, sonst die aus dem Repo-Plan mit gleichem Namen
   (auch Studio-Varianten „Einheit A – S53“ oder ähnliche Namen wie „A – Hintere Kette“) */
function mobilityFor(plan){
  if(!plan) return [];
  if(plan.mobility && plan.mobility.length) return plan.mobility;
  const rm = D.repoMobility || {};
  const base = (plan.name || "").split(" – ")[0];
  if(rm[base]) return rm[base];
  const nb = normName(base), keys = Object.keys(rm);
  const k = keys.find(k => nb.includes(normName(k))) || keys.find(k => normName(k).endsWith(nb) && nb.length <= 2);
  return k ? rm[k] : [];
}
function startWorkout(plan){

    title: plan ? plan.name + " – " + plan.subtitle : "Freies Training",

}

const thumbCache = new Map();
async function hydrateThumbs(){
  for(const box of document.querySelectorAll("[data-thumbs]")){
    const name = box.dataset.thumbs;
    const ids = detail(name).images;
    const srcs = [];
    for(const id of ids){
      if(!thumbCache.has(id)) thumbCache.set(id, await imgGet(id));
      const src = thumbCache.get(id);
      if(src) srcs.push(src);
    }
    if(!box.isConnected) continue;
    const frag = document.createDocumentFragment();
    for(const src of srcs){
      const im = new Image(); im.src = src; im.decoding = "sync";
      im.onclick = () => openLightbox(srcs, srcs.indexOf(src));
      frag.appendChild(im);
    }
    box.replaceChildren(frag);
  }
}

/* --- Statistik --- */

function weeklyVolume(n){
  const out = [];
  const now = new Date();
  const monday = new Date(now); 
  const wd = (now.getDay() + 6) % 7;
  monday.setHours(0,0,0,0); monday.setDate(monday.getDate() - wd);
  for(let k = n-1; k >= 0; k--){
    const s = new Date(monday); s.setDate(s.getDate() - k*7);
    const e = new Date(s); e.setDate(e.getDate() + 7);
    const ws = D.history.filter(w => w.start >= s.getTime() && w.start < e.getTime());
    out.push({ start: s.getTime(), volume: ws.reduce((a,w) => a + wkVolume(w), 0) });
  }
  return out;
}

let statPick = "", statUnitPick = "";
function viewStats(){
  if(!D.history.length) return `<div class="wrap"><h1>Statistik</h1>
    <div class="empty"><b>Noch keine Daten</b>
    Sobald zwei, drei Einheiten gespeichert sind, wird die Entwicklung hier sichtbar.</div></div>`;

  const cutoff = Date.now() - 30*86400000;
  const recent = D.history.filter(w => w.start >= cutoff);
  const weeks = weeklyVolume(8);
  const peak = Math.max(1, ...weeks.map(w => w.volume));
  const names = [...new Set(D.history.flatMap(w => w.exercises.map(e => e.name)))].sort();
  if(!names.includes(statPick)) statPick = names[0] || "";

  /* kg und Stufen sind nicht vergleichbar → eine Kurve je Einheit */
  const statUnits = [...new Set(D.history.flatMap(w => w.exercises
    .filter(e => e.name === statPick && progress(e) > 0).map(exUnit)))];
  if(!statUnits.includes(statUnitPick)){
    const last = lastLog(statPick);
    statUnitPick = last && statUnits.includes(exUnit(last.ex)) ? exUnit(last.ex) : (statUnits[0] || unitOf(statPick));
  }
  const statUnit = statUnitPick;

  const pts = D.history
    .filter(w => w.exercises.some(e => e.name === statPick && exUnit(e) === statUnit && progress(e) > 0))
    .map(w => ({ t: w.start, v: progress(w.exercises.find(e => e.name === statPick && exUnit(e) === statUnit)) }))
    .sort((a,b) => a.t - b.t);

  const statStufe = statUnit === "stufe";
  let chart = `<p class="small muted">Mindestens zwei Einheiten mit dieser Übung nötig, damit eine Kurve entsteht.</p>`;
  if(pts.length >= 2){
    const lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
    const span = (hi - lo) || 1;
    const W = 280, H = 90;
    const xy = pts.map((p,i) => [
      10 + i*(W-20)/(pts.length-1),
      H - 12 - ((p.v - lo)/span)*(H-30)
    ]);
    const change = Math.round((pts[pts.length-1].v - pts[0].v)/pts[0].v*100);
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:96px;margin-top:8px">
        <polyline points="${xy.map(p=>p.join(",")).join(" ")}" fill="none"
          stroke="var(--amber)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${xy.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--amber)"/>`).join("")}
      </svg>
      <div class="small num" style="font-weight:600;color:${change>=0?"var(--green)":"var(--tx2)"}">
        ${change>=0?"+":""}${change} % seit ${dayShort(pts[0].t)}</div>
      <div class="tiny muted" style="margin-top:4px">${statUnit === "sek"
        ? "Längste Haltezeit je Einheit, in Sekunden."
        : statUnit === "seite"
        ? "Meiste Wiederholungen pro Seite je Einheit."
        : statStufe
        ? "Höchste Gewichtsstufe je Einheit. Bei Stufen lässt sich kein Maximalgewicht schätzen."
        : "Geschätztes Einwiederholungsmaximum nach Epley — macht Sätze mit unterschiedlichen Wiederholungszahlen vergleichbar. Übungen mit Stufen fließen nicht ins Volumen ein."}</div>`;
  }

  return `<div class="wrap"><h1>Statistik</h1>
    <div class="stats">
      <div class="stat"><b>${recent.length}</b><span class="tiny muted">Einheiten, 30 Tage</span></div>
      <div class="stat"><b>${vol(recent.reduce((a,w)=>a+wkVolume(w),0))}</b><span class="tiny muted">Volumen, 30 Tage</span></div>
      <div class="stat"><b>${daysSince() ?? "–"}</b><span class="tiny muted">Tage seit zuletzt</span></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="eyebrow">Volumen pro Woche</div>
      <div class="bars">${weeks.map(w =>
        `<i style="height:${Math.max(2, w.volume/peak*100)}%"></i>`).join("")}</div>
      <div class="between tiny muted" style="margin-top:6px">
        <span>${dayShort(weeks[0].start)}</span><span>${dayShort(weeks[weeks.length-1].start)}</span>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Entwicklung einer Übung</div>
      <select class="txt" id="statpick" style="margin-top:8px">
        ${names.map(n => `<option ${n===statPick?"selected":""}>${esc(n)}</option>`).join("")}
      </select>
      ${statUnits.length > 1 ? `<div class="seg" style="margin-top:8px">${statUnits.map(u =>
        `<button data-statunit="${u}" class="${u===statUnit?"on":""}">${u==="stufe"?"Stufen":unitLong(u)}</button>`).join("")}</div>` : ""}
      ${chart}
    </div>
  </div>`;
}

  openSheet(p.name, `

    <input class="txt" id="pn" value="${esc(p.name)}">
    <label class="lbl">Untertitel</label>
    <input class="txt" id="ps" value="${esc(p.subtitle||"")}">

    <div class="card" style="padding:4px 14px">
      ${p.exercises.map((e,j) => `<div class="listitem between" data-ex="${j}" style="gap:6px">

        <span class="muted">›</span></div>`).join("") || '<div class="listitem muted small">Noch keine Übung.</div>'}
    </div>
    <button class="btn ghost" id="addex" style="margin-top:10px">Übung hinzufügen</button>

    ${p.exercises.length ? `<label class="lbl">Gewicht für alle Übungen dieses Plans</label>
    <div class="seg"><button id="allkg">in kg</button><button id="allst">in Stufen</button></div>
    <div class="tiny muted" style="margin-top:5px">Gilt nur für diesen Plan — so kann derselbe Plan in einem Studio in kg und im anderen in Stufen laufen. Übungen in Sek oder Wdh./Seite bleiben unverändert. Einzelne Übungen kannst du danach noch umstellen.</div>` : ""}

    <label class="lbl">Aufwärmen &amp; Mobilität</label>
    <textarea class="txt" id="pm" rows="5">${esc((p.mobility||[]).join("\n"))}</textarea>
    <div class="tiny muted" style="margin-top:5px">Ein Punkt pro Zeile.</div>

    <button class="btn ghost" id="dupplan" style="margin-top:22px">Plan duplizieren</button>
    <div class="tiny muted" style="margin-top:5px">Für ein zweites Studio. Ohne Kürzel bleibt der Verlauf pro Übung zusammen; die Einheit (kg/Stufen) stellst du in der Kopie einfach oben um. Ein Kürzel trennt die Übungen komplett.</div>

    <button class="btn danger" id="delplan" style="margin-top:22px">Plan löschen</button>
  `, () => {
    const b = document.getElementById("sheetbody");
    b.querySelector("#pn").oninput = e => { p.name = e.target.value; save(); };
    b.querySelector("#ps").oninput = e => { p.subtitle = e.target.value; save(); };
    b.querySelector("#pm").oninput = e => {
      p.mobility = e.target.value.split("\n").map(s => s.trim()).filter(Boolean); save(); };
    b.querySelectorAll("[data-ex]").forEach(el =>
      el.onclick = () => openExerciseSheet(p, +el.dataset.ex));
    b.querySelectorAll("[data-mv]").forEach(btn => btn.onclick = ev => {
      ev.stopPropagation();
      const [j, d] = btn.dataset.mv.split(".").map(Number);
      const k = j + d;
      if(k < 0 || k >= p.exercises.length) return;
      [p.exercises[j], p.exercises[k]] = [p.exercises[k], p.exercises[j]];
      save();
      const y = b.scrollTop;
      sheetStack.pop(); openPlanSheet(i);
      document.getElementById("sheetbody").scrollTop = y;
    });
    b.querySelector("#addex").onclick = () => openPicker("Übung zum Plan", (name, isNew) => {
      const tpl = knownExercises().find(k => k.name === name);
      const src = tpl && tpl.plan;
      unhide(name);
      p.exercises.push({ id: uid(), name, unit: src ? peUnit(src) : unitOf(name),
        sets: src ? src.sets : 3, reps: src ? src.reps : 10, rest: src ? src.rest : 60 });
      save();
      sheetStack.pop(); sheetStack.pop();
      openPlanSheet(i);
      if(isNew) openExerciseSheet(p, p.exercises.length-1);
    });
    const bulk = u => {
      p.exercises.forEach(e => { if(isWeight(peUnit(e))) e.unit = u; }); save();
      sheetStack.pop(); openPlanSheet(i);
    };
    const ak = b.querySelector("#allkg"), as = b.querySelector("#allst");
    if(ak){ ak.onclick = () => bulk("kg"); as.onclick = () => bulk("stufe"); }
    b.querySelector("#dupplan").onclick = () => {
      const suffix = prompt(
        "Kürzel für die Übungen? Zum Beispiel „S53“.\n\n" +
        "Es wird an jeden Übungsnamen angehängt, damit die App die Gewichte pro Studio getrennt merkt. " +
        "Leer lassen, wenn die Namen gleich bleiben sollen.", "");
      if(suffix === null) return;
      const s = suffix.trim();
      const copy = {
        id: uid(),
        name: p.name + (s ? " – " + s : " (Kopie)"),
        subtitle: p.subtitle,
        mobility: [...(p.mobility||[])],
        exercises: (p.exercises||[]).map(e => ({
          id: uid(),
          name: s ? e.name + " " + s : e.name, unit: peUnit(e),
          sets: e.sets, reps: e.reps, rest: e.rest
        }))
      };
      if(s){
        for(const e of p.exercises||[]){
          const src = D.library[e.name];
          if(src) D.library[e.name + " " + s] = { text: src.text, images: [...src.images] };
          if(D.units[e.name]) D.units[e.name + " " + s] = D.units[e.name];
        }
      }
      D.plans.push(copy); save();
      sheetStack.pop();
      openPlanSheet(D.plans.length - 1);
    };

    b.querySelector("#delplan").onclick = () => {
      if(!confirm("Plan „" + p.name + "\u201c wirklich löschen?")) return;
      D.plans.splice(i,1); save(); closeSheet();
    };
  });
}

function openExerciseSheet(plan, j){
  const e = plan.exercises[j];
  let before = e.name;
  openSheet("Übung", `
    <label class="lbl">Name</label>
    <input class="txt" id="en" value="${esc(e.name)}">

    <button class="btn ghost" id="opendet" style="margin-top:14px">Beschreibung &amp; Bilder</button>

    <label class="lbl">Angabe in</label>
    <div class="seg seg4">
      <button data-u="kg" class="${peUnit(e)==="kg"?"on":""}">kg</button>
      <button data-u="stufe" class="${peUnit(e)==="stufe"?"on":""}">Stufen</button>
      <button data-u="sek" class="${peUnit(e)==="sek"?"on":""}">Sek</button>
      <button data-u="seite" class="${peUnit(e)==="seite"?"on":""}">Wdh./Seite</button>
    </div>
    <div class="tiny muted" style="margin-top:5px">kg/Stufen gelten nur für diesen Plan (pro Studio). Sek (Haltezeit mit Countdown, z. B. Plank) und Wdh./Seite (ohne Gewicht, z. B. Dead Bugs) gelten überall, wo die Übung vorkommt.</div>

    <label class="lbl">Sätze</label>
    <input class="txt" id="es" type="number" inputmode="numeric" value="${e.sets}">
    <label class="lbl" id="erl">${repsLabel(peUnit(e))}</label>
    <input class="txt" id="er" type="number" inputmode="numeric" value="${e.reps}">
    <div id="sidesbox" style="${isWeight(peUnit(e)) ? "" : "display:none"}">
      <label class="toggle"><span><b style="font-weight:600">Links/rechts getrennt</b>
        <div class="tiny muted">Pro Satz je Gewicht und Wdh. für links und rechts. Pause erst nach beiden Seiten.</div></span>
        <input type="checkbox" id="esd" ${e.sides ? "checked" : ""}></label>
      <div id="erlbox" style="${e.sides ? "" : "display:none"}">
        <label class="lbl">Wiederholungen links (leer = wie rechts)</label>
        <input class="txt" id="erL" type="number" inputmode="numeric" value="${e.repsL || ""}" placeholder="${e.reps}">
      </div>
    </div>
    <label class="lbl">Pause in Sekunden</label>
    <input class="txt" id="ep" type="number" inputmode="numeric" step="15" value="${e.rest}">

    <button class="btn danger" id="delex" style="margin-top:26px">Übung entfernen</button>
  `, () => {
    const b = document.getElementById("sheetbody");
    b.querySelector("#en").oninput = ev => {
      const now = ev.target.value;
      if(before !== now && D.library[before]){ D.library[now] = D.library[before]; delete D.library[before]; }
      if(before !== now && D.units[before]){ D.units[now] = D.units[before]; delete D.units[before]; }
      e.name = now; before = now; save();
    };
    b.querySelector("#es").oninput = ev => { e.sets = Math.max(1, +ev.target.value||1); save(); };
    b.querySelector("#er").oninput = ev => { e.reps = Math.max(1, +ev.target.value||1); save(); };
    b.querySelector("#ep").oninput = ev => { e.rest = Math.max(0, +ev.target.value||0); save(); };
    b.querySelector("#esd").onchange = ev => { e.sides = ev.target.checked; if(!e.sides) delete e.repsL;
      b.querySelector("#erlbox").style.display = e.sides ? "" : "none"; save(); };
    b.querySelector("#erL").oninput = ev => { const v = +ev.target.value; if(v > 0) e.repsL = v; else delete e.repsL; save(); };
    b.querySelector("#opendet").onclick = () => openDetailSheet(e.name);
    b.querySelectorAll("[data-u]").forEach(btn => btn.onclick = () => {
      const nu = btn.dataset.u, old = peUnit(e);
      e.unit = nu;
      /* Wechsel von/zu Sek bzw. Wdh./Seite betrifft die Übung selbst → in allen Plänen */
      if(!isWeight(nu) || !isWeight(old))
        D.plans.forEach(p => (p.exercises||[]).forEach(x => { if(x.name === e.name) x.unit = nu; }));
      setUnit(e.name, nu); /* Voreinstellung für neue Pläne und freies Training */
      save();
      b.querySelectorAll("[data-u]").forEach(x => x.classList.toggle("on", x === btn));
      b.querySelector("#erl").textContent = repsLabel(btn.dataset.u);
      b.querySelector("#sidesbox").style.display = isWeight(nu) ? "" : "none";
    });
    b.querySelector("#delex").onclick = () => {
      if(!confirm("Übung entfernen?")) return;
      plan.exercises.splice(j,1); save(); closeSheet();
    };
  });
}

      const q = qi.value.trim();
      const ql = q.toLowerCase();

      const exact = all.some(k => k.name.toLowerCase() === ql);
      b.querySelector("#pnew").innerHTML = q && !exact
        ? `<button class="btn" id="pmk" style="margin-top:10px">Neu anlegen: „${esc(q)}“</button>` : "";

            <div class="tiny muted">${unitLong(unitOf(k.name))}${k.last ? " · zuletzt " + dayShort(k.last) : ""}${catsOf(k.name).length ? " · " + catsOf(k.name).map(catLabel).map(esc).join(", ") : ""}</div></div>
          <span class="muted">+</span></div>`).join("")
        || `<div class="listitem muted small">${all.length ? "Keine passende Übung." : "Noch keine Übungen im Archiv."}</div>`;

    qi.oninput = paint;

function reopenArchive(){
  if(tab === "lib"){ sheetStack = []; document.getElementById("sheet").classList.remove("show"); render(); return; }
  sheetStack.pop(); sheetStack.pop();

function openArchiveItem(name){
  const k = knownExercises().find(x => x.name === name) || { plans: 0, logs: 0 };
  const others = knownExercises().filter(x => x.name !== name);
  openSheet(name, `
    <label class="lbl">Umbenennen</label>
    <input class="txt" id="an" value="${esc(name)}" autocomplete="off">
    <button class="btn" id="aren" style="margin-top:10px">Umbenennen</button>
    <div class="tiny muted" style="margin-top:5px">Ändert den Namen überall — in allen Plänen und im Verlauf. Gibt es den neuen Namen schon, werden beide Übungen zusammengeführt.</div>

    ${others.length ? `<label class="lbl">Zusammenführen mit</label>
    <select class="txt" id="amerge">
      <option value="">Übung wählen …</option>
      ${others.map(o => `<option value="${esc(o.name)}">${esc(o.name)}</option>`).join("")}
    </select>
    <button class="btn ghost" id="amgo" style="margin-top:10px">Zusammenführen</button>
    <div class="tiny muted" style="margin-top:5px">„${esc(name)}“ verschwindet, alle Einträge wandern zur gewählten Übung. Praktisch bei Tippfehlern.</div>` : ""}

    <button class="btn danger" id="adel" style="margin-top:26px">Aus Archiv löschen</button>
    <div class="tiny muted" style="margin-top:5px">Entfernt die Übung aus ${k.plans===1?"1 Plan":k.plans+" Plänen"} und löscht Beschreibung und Bilder. ${k.logs ? "Die " + k.logs + " gespeicherten Trainings im Verlauf bleiben erhalten." : ""}</div>
  `, () => {
    const b = document.getElementById("sheetbody");
    const doRename = to => {
      to = (to||"").trim();
      if(!to || to === name) return;
      const exists = knownExercises().some(x => x.name === to) || D.history.some(w => (w.exercises||[]).some(e => e.name === to));
      if(!confirm(exists
        ? "„" + name + "“ mit „" + to + "“ zusammenführen?\n\nAlle Einträge laufen danach unter „" + to + "“."
        : "„" + name + "“ überall in „" + to + "“ umbenennen?")) return;
      renameExercise(name, to);
      reopenArchive();
    };
    b.querySelector("#aren").onclick = () => doRename(b.querySelector("#an").value);
    const mg = b.querySelector("#amgo");
    if(mg) mg.onclick = () => doRename(b.querySelector("#amerge").value);
    b.querySelector("#adel").onclick = () => {
      if(!confirm("„" + name + "“ wirklich aus dem Archiv löschen?")) return;
      deleteExercise(name);
      reopenArchive();
    };
  });
}

/* ---------- Übungen (Archiv nach Kategorien) ---------- */

const DEFAULT_CATS = [
  { id:"haltung",  label:"Haltung & Schulterblatt", hint:"Gegen vorgerollte Schultern und Kopf-nach-vorn" },
  { id:"kette",    label:"Hintere Kette & Gesäß",   hint:"Gegen die steife rechte hintere Seite" },
  { id:"rumpf",    label:"Rumpf & Becken",          hint:"Gegen das Hohlkreuz, ohne Druck auf den Bauch" },
  { id:"hüfte",    label:"Hüfte & Mobilität",       hint:"Gegen die Hüftsteife" },
  { id:"dehnen",   label:"Dehnen & Nacken",         hint:"Entlastung für SCM und Nacken" },
  { id:"beine",    label:"Beine",                   hint:"" },
  { id:"drücken",  label:"Brust & Drücken",         hint:"" },
  { id:"optik",    label:"Arme & Schulter-Optik",   hint:"" },
  { id:"pause",    label:"Pausiert / Vorsicht",     hint:"Gerade nicht empfohlen – Grund steht in der Beschreibung" }
];
const catDefs = () => (D.catDefs && D.catDefs.length ? D.catDefs : DEFAULT_CATS);
const catLabel = id => (catDefs().find(c => c.id === id) || { label: id }).label;
const catsOf = name => (D.cats && D.cats[name]) || (D.repoCats && D.repoCats[name]) || [];
let libQ = "", libCat = "";

function libItems(){
  const known = knownExercises();
  const ql = libQ.trim().toLowerCase();
  const match = (name, cats) => (!ql || name.toLowerCase().includes(ql)) && (!libCat || (libCat === "_none" ? !cats.length : cats.includes(libCat)));
  const own = known.map(k => ({ ...k, cats: catsOf(k.name) })).filter(k => match(k.name, k.cats));
  const knownSet = new Set(known.map(k => k.name));
  const sug = Object.entries(D.catalog || {}).filter(([n]) => !knownSet.has(n))
    .map(([n, v]) => ({ name: n, cats: v.cat || [] })).filter(k => match(k.name, k.cats))

function libRow(k, sug, hide){
  const tags = k.cats.filter(c => c !== libCat && c !== hide).map(c => `<span class="tag">${esc(catLabel(c))}</span>`).join("");
  const meta = sug ? "" : `<div class="tiny muted">${k.plans ? (k.plans === 1 ? "in 1 Plan" : "in " + k.plans + " Plänen") : "in keinem Plan"}${k.logs ? " · " + k.logs + "× trainiert" : ""}</div>`;

    <div class="grow"><div class="trunc">${esc(k.name)}</div>${meta}${tags ? `<div>${tags}</div>` : ""}</div>

function libListHTML(){

/* ---------- Bild-Vollansicht (Zoom, Wischen) ---------- */
const LB = { srcs: [], i: 0, s: 1, x: 0, y: 0 };
function lbApply(anim){
  const im = document.getElementById("lbimg");
  im.style.transition = anim ? "transform .2s ease" : "none";
  im.style.transform = `translate(calc(-50% + ${LB.x}px), calc(-50% + ${LB.y}px)) scale(${LB.s})`;
}
function lbShow(i){
  LB.i = (i + LB.srcs.length) % LB.srcs.length; LB.s = 1; LB.x = 0; LB.y = 0;
  document.getElementById("lbimg").src = LB.srcs[LB.i];
  document.getElementById("lbcount").textContent = LB.srcs.length > 1 ? (LB.i + 1) + " / " + LB.srcs.length + " · wischen für weitere" : "";
  lbApply(false);
}
function openLightbox(srcs, i){
  if(!srcs || !srcs.length) return;
  LB.srcs = srcs; document.getElementById("lightbox").classList.add("show"); lbShow(Math.max(0, i));
}
async function openLightboxIds(ids, i){
  const srcs = [];
  for(const id of ids){ if(!thumbCache.has(id)) thumbCache.set(id, await imgGet(id)); const s = thumbCache.get(id); if(s) srcs.push(s); }
  openLightbox(srcs, i);
}
function closeLightbox(){ document.getElementById("lightbox").classList.remove("show"); document.getElementById("lbimg").removeAttribute("src"); }
/* Verschieben begrenzen, damit das gezoomte Bild nicht aus dem Bildschirm rutscht */
function lbClamp(){
  const im = document.getElementById("lbimg");
  const w = im.offsetWidth * LB.s, h = im.offsetHeight * LB.s;
  const mx = Math.max(0, (w - innerWidth) / 2), my = Math.max(0, (h - innerHeight) / 2);
  LB.x = Math.min(mx, Math.max(-mx, LB.x)); LB.y = Math.min(my, Math.max(-my, LB.y));
}
(() => {
  const el = document.getElementById("lightbox");
  let start = null, lastTap = 0, moved = false;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  document.getElementById("lbclose").onclick = ev => { ev.stopPropagation(); closeLightbox(); };
  el.addEventListener("touchstart", ev => {
    const t = ev.touches; moved = false;
    if(t.length === 2) start = { pinch: true, d: dist(t), s: LB.s };
    else if(t.length === 1) start = { pinch: false, px: t[0].clientX, py: t[0].clientY, x: LB.x, y: LB.y };
  }, { passive: true });
  el.addEventListener("touchmove", ev => {
    if(!start) return;
    const t = ev.touches; ev.preventDefault();
    if(start.pinch && t.length === 2){ LB.s = Math.min(5, Math.max(1, start.s * dist(t) / start.d)); moved = true; lbClamp(); lbApply(false); }
    else if(!start.pinch && t.length === 1){
      const dx = t[0].clientX - start.px, dy = t[0].clientY - start.py;
      if(Math.abs(dx) + Math.abs(dy) > 8) moved = true;
      if(LB.s > 1){ LB.x = start.x + dx; LB.y = start.y + dy; lbClamp(); }
      else { LB.x = dx; LB.y = Math.max(0, dy); }
      lbApply(false);
    }
  }, { passive: false });
  el.addEventListener("touchend", ev => {
    if(!start || ev.touches.length) return;
    const s0 = start; start = null;
    if(!s0.pinch && LB.s === 1 && moved){
      /* nach unten wischen schließt, seitlich wechselt das Bild */
      if(LB.y > 110){ closeLightbox(); return; }
      if(Math.abs(LB.x) > 70 && LB.srcs.length > 1){ lbShow(LB.i + (LB.x < 0 ? 1 : -1)); return; }
      LB.x = 0; LB.y = 0; lbApply(true); return;
    }
    if(LB.s < 1.05){ LB.s = 1; LB.x = 0; LB.y = 0; lbApply(true); }
    if(!moved){
      const now = Date.now();
      if(now - lastTap < 300){ /* Doppeltipp: 2,5× zoomen bzw. zurück */
        if(LB.s > 1){ LB.s = 1; LB.x = 0; LB.y = 0; } else LB.s = 2.5;
        lbClamp(); lbApply(true); lastTap = 0;
      } else lastTap = now;
    }
  });
  /* Maus: Klick neben das Bild schließt, Doppelklick zoomt */
  el.addEventListener("click", ev => { if(ev.target === el) closeLightbox(); });
  el.addEventListener("dblclick", () => { LB.s = LB.s > 1 ? 1 : 2.5; LB.x = 0; LB.y = 0; lbApply(true); });
  document.addEventListener("keydown", ev => {
    if(!el.classList.contains("show")) return;
    if(ev.key === "Escape") closeLightbox();
    if(ev.key === "ArrowRight") lbShow(LB.i + 1);
    if(ev.key === "ArrowLeft") lbShow(LB.i - 1);
  });
})();

async function exportAll(){
  const payload = { version: 1, exported: new Date().toISOString(), data: D, images: await imgAll() };
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `studio-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

document.getElementById("jsonpick").onchange = ev => {
  const f = ev.target.files[0];
  ev.target.value = "";
  if(!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p.data || !p.data.plans) throw 0;
      if(!confirm("Alle aktuellen Daten werden ersetzt. Fortfahren?")) return;
      D = p.data; migrate(); save();
      if(p.images) for(const [id, src] of Object.entries(p.images)) await imgPut(id, src);
      alert("Wiederhergestellt.");
      render();
    }catch(e){ alert("Die Datei konnte nicht gelesen werden."); }
  };
  fr.readAsText(f);
};

/* ---------- Ereignisse ---------- */

function bind(){
  const q = (s, fn) => document.querySelectorAll(s).forEach(fn);

  q("[data-start]", b => b.onclick = () => startWorkout(D.plans.find(p => p.id === b.dataset.start)));
  q("[data-freestart]", b => b.onclick = () => startWorkout(null));

  q("[data-discard]", b => b.onclick = () => {
    if(!confirm("Training verwerfen? Die eingetragenen Sätze gehen verloren.")) return;
    D.active = null; Rest.stop(); save(); render();
  });
  q("[data-finish]", b => b.onclick = () => {
    if(!confirm("Training beenden und speichern? Nur abgehakte Sätze werden übernommen.")) return;
    finishWorkout();
  });

  q("[data-w]", el => el.onchange = () => {
    const [x,s] = el.dataset.w.split(".").map(Number);
    D.active.exercises[x].sets[s].w = parseFloat(el.value.replace(",",".")) || 0; save();
  });
  q("[data-r]", el => el.onchange = () => {
    const [x,s] = el.dataset.r.split(".").map(Number);
    D.active.exercises[x].sets[s].r = parseInt(el.value) || 0; save();
  });

  q("[data-sw]", el => el.onchange = () => {
    const [x,si,k] = el.dataset.sw.split(".");
    D.active.exercises[+x].sets[+si][k] = parseFloat(el.value.replace(",",".")) || 0; save();
  });
  q("[data-sr]", el => el.onchange = () => {
    const [x,si,k] = el.dataset.sr.split(".");
    D.active.exercises[+x].sets[+si][k] = parseInt(el.value) || 0; save();
  });
  q("[data-tick]", b => b.onclick = () => {
    const [x,s] = b.dataset.tick.split(".").map(Number);
    const set = D.active.exercises[x].sets[s];
    set.done = !set.done;
    save(); render();
    if(set.done) Rest.start(D.active.exercises[x].rest, D.active.exercises[x].name);
  });

  q("[data-hold]", b => b.onclick = () => {
    const key = b.dataset.hold;
    const [x,si] = key.split(".").map(Number);
    const ex = D.active.exercises[x];
    if(Rest.running && Rest.key === key){ Rest.stop(); return; }
    const secs = ex.sets[si].r || ex.reps;
    Rest.start(secs, ex.name + " · Satz " + (si+1), { mode: "work", key, onDone: () => {
      if(!D.active || !D.active.exercises[x] || !D.active.exercises[x].sets[si]) return;
      const set = D.active.exercises[x].sets[si];
      set.done = true; if(!set.r) set.r = secs;
      save(); render();
      Rest.start(ex.rest, ex.name);
    }});
    render();
  });

  q("[data-addset]", b => b.onclick = () => {
    const ex = D.active.exercises[+b.dataset.addset];
    const last = ex.sets[ex.sets.length-1];
    const ns = { w: last ? last.w : 0, r: last ? last.r : ex.reps, done: false };
    if(ex.sides){ ns.wl = last && last.wl !== undefined ? last.wl : ns.w; ns.rl = last && last.rl !== undefined ? last.rl : (ex.repsL || ex.reps); }
    ex.sets.push(ns);
    save(); render();
  });

  q("[data-addex]", b => b.onclick = () => openPicker("Übung hinzufügen", name => {
    const tpl = knownExercises().find(k => k.name === name);
    const src = tpl && tpl.plan;
    const n = src ? src.sets : 3, reps = src ? src.reps : 10;
    unhide(name);
    const sd = !!(src && src.sides && isWeight(unitOf(name)));
    D.active.exercises.push({ name, unit: unitOf(name), target: n, reps, rest: src ? src.rest : 60,
      sides: sd, repsL: sd ? src.repsL : undefined,
      sets: prefillSets(name, n, reps, unitOf(name), sd, sd ? src.repsL : undefined) });
    save(); closeSheet();
  }));

  q("[data-unit]", b => b.onclick = () => {
    const ex = D.active.exercises[+b.dataset.unit];
    if(!isWeight(exUnit(ex))){ alert("Die Angabe für diese Übung (" + unitLong(exUnit(ex)) + ") änderst du unter Pläne → Übung."); return; }
    const nu = exUnit(ex) === "stufe" ? "kg" : "stufe";
    ex.unit = nu;
    /* Nur dieser Plan merkt sich die Umstellung — der Plan des anderen Studios bleibt unberührt */
    const plan = D.active.planId && D.plans.find(p => p.id === D.active.planId);
    const pe = plan && plan.exercises.find(x => x.name === ex.name);
    if(pe) pe.unit = nu; else setUnit(ex.name, nu);
    /* Offene Sätze mit den letzten Werten in der neuen Einheit vorbelegen */
    const fresh = prefillSets(ex.name, ex.sets.length, ex.reps, nu, ex.sides, ex.repsL);
    ex.sets.forEach((s,i) => { if(!s.done){ s.w = fresh[i].w; if(ex.sides) s.wl = fresh[i].wl; } });
    save(); render();
  });

  q("[data-info]", b => b.onclick = () => openDetailSheet(b.dataset.info));
  q("[data-hist]", el => el.onclick = () => openHistSheet(+el.dataset.hist));
  q("[data-plan]", el => el.onclick = () => openPlanSheet(+el.dataset.plan));

  q("[data-newplan]", b => b.onclick = () => {
    D.plans.push({ id: uid(), name: "Neue Einheit", subtitle: "", mobility: [], exercises: [] });
    save(); openPlanSheet(D.plans.length-1);
  });

  q("[data-mob]", el => el.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); openMobility(el.dataset.mob); });
  q("[data-mobtoggle]", el => el.onclick = () => { const w = D.active;
    const all = w && (w.mobDone||[]).length >= workoutMobility(w).length;
    mobOpen = !(mobOpen === null ? !all : mobOpen); render(); });
  q("[data-mobtick]", b => b.onclick = () => { const i = +b.dataset.mobtick, w = D.active;
    w.mobDone = w.mobDone.includes(i) ? w.mobDone.filter(x => x !== i) : [...w.mobDone, i]; save(); render(); });
  q("[data-archive]", b => b.onclick = () => { tab = "lib"; render(); window.scrollTo(0,0); });
  bindLib();
  q("[data-remoteshow]", b => b.onclick = openRemoteSheet);
  q("[data-export]", b => b.onclick = exportAll);
  q("[data-import]", b => b.onclick = () => document.getElementById("jsonpick").click());

  const sp = document.getElementById("statpick");
  if(sp) sp.onchange = () => { statPick = sp.value; statUnitPick = ""; render(); };
  q("[data-statunit]", b => b.onclick = () => { statUnitPick = b.dataset.statunit; render(); });
}

/* ---------- Start ---------- */

load();
render();
checkRemote();

/* Laufende Trainingsdauer: nur die Zahl aktualisieren, nicht die ganze Ansicht neu zeichnen */
setInterval(() => {
  if(!D.active || document.hidden) return;
  const el = document.querySelector("[data-dur]");
  if(!el) return;
  const t = dur(Date.now() - D.active.start);
  if(el.textContent !== t) el.textContent = t;
}, 15000);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
